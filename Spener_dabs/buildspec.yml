version: 0.2

env:
  variables:
    TARGET: "dev"

  secrets-manager:
    DATABRICKS_HOST: "CICD/DEV_DATABRICKS_HOST"
    DATABRICKS_CLIENT_ID: "CICD/DEV_DATABRICKS_CLIENT_ID"
    DATABRICKS_CLIENT_SECRET: "CICD/DATABRICKS_CLIENT_SECRET"

phases:

  install:
    runtime-versions:
      python: 3.11

    commands:
      - echo "Installing required dependencies"
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - databricks version

  pre_build:
    commands:
      - echo "Validating Databricks Asset Bundle"
      - databricks bundle validate -t $TARGET

  build:
    commands:
      - echo "Deploying Databricks Asset Bundle"
      - databricks bundle deploy -t $TARGET
```
