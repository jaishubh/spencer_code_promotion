version: 0.2

env:
  variables:
    TARGET: "dev"

  secrets-manager:
    DATABRICKS_HOST: "CICD/DEV_DATABRICKS_HOST:DEV_DATABRICKS_HOST"
    DATABRICKS_CLIENT_ID: "CICD/DEV_DATABRICKS_CLIENT_ID:DEV_DATABRICKS_CLIENT_ID"
    DATABRICKS_CLIENT_SECRET: "CICD/DATABRICKS_CLIENT_SECRET:DEV_DATABRICKS_CLIENT_SECRET"

phases:
  install:
    commands:
      - echo "Installing Databricks CLI"
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - databricks version

  pre_build:
    commands:
      - echo "Validating Databricks Asset Bundle"
      - cd Spener_dabs
      - databricks auth describe
      - databricks bundle validate -t $TARGET

  build:
    commands:
      - echo "Deploying Databricks Asset Bundle"
      - databricks bundle deploy -t $TARGET
